[workspace]
members = ["crates/*", "bins/*"]
# vendor/* holds the in-tree copy of LaihoE/demoparser (a dev-only dependency of
# cs2-demo-rank's cross-validation examples). Cargo would otherwise auto-include
# these path deps as workspace members — which pulls their third-party test
# targets into `--workspace` build/test/clippy. Exclude them so the workspace's
# quality gates only cover first-party code; they still build fine as path deps.
exclude = ["vendor/parser", "vendor/csgoproto"]
resolver = "2"

[workspace.dependencies]
steam-vent = { version = "0.4", features = ["csgo"] }
steam-vent-proto = "0.5"
steam-vent-proto-csgo = "0.5"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
governor = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
parallel_bzip2_decoder = "0.2"
rayon = "1"
snap = "1"
