[package]
name = "steam-guard-link"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "One-shot Steam mobile authenticator linker driven through the guard code-entry page"

[dependencies]
portal-daemon = { path = "../../crates/portal-daemon" }
steam-vent.workspace = true
reqwest.workspace = true
# Steam encrypts the login password with the RSA key it hands out; the
# version tracks steam-vent-crypto's so the workspace resolves one copy.
rsa = "0.9"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
rpassword.workspace = true
serde_json.workspace = true
rand.workspace = true
base64 = "0.22"
hmac = "0.12"
sha1 = "0.10"
