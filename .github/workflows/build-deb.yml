name: build-deb

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (branch, tag, or SHA)"
        required: false
        default: ""

permissions:
  contents: write   # create/upload the release

# One build per ref at a time; never cancel a release build midway.
concurrency:
  group: build-deb-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A tag on a broken commit must not publish a deb.
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"

      - uses: Swatinem/rust-cache@v2

      # The deb version comes from cs2-enricher's Cargo.toml (the crate
      # that owns the portal-steam-bot deb metadata), NOT the tag — a
      # mismatched tag would silently publish a differently-versioned deb
      # and `just deploy-steam-bot-release vX.Y.Z` would install the wrong
      # thing while reporting success.
      - name: Tag matches Cargo version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CARGO_V=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "cs2-enricher") | .version')
          if [ "$TAG" != "$CARGO_V" ]; then
            echo "::error::tag v$TAG != cs2-enricher Cargo.toml version $CARGO_V — bump the version, re-tag, and push again"
            exit 1
          fi

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      # The deb (portal-steam-bot) ships two release binaries — build both,
      # then package without rebuilding. Mirrors the documented deploy command.
      - name: Build release binaries
        run: cargo build --release --locked -p cs2-poller -p cs2-enricher

      - name: Build deb
        run: cargo deb -p cs2-enricher --no-build

      - name: Stage artifacts + checksums
        run: |
          mkdir -p out
          cp target/debian/*.deb out/
          (cd out && sha256sum *.deb > SHA256SUMS)
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: portal-steam-bot-deb
          path: out/*
          if-no-files-found: error

  # Install the deb on a clean runner: catches a broken postinst, units
  # shipped without enable hooks (the silent cargo-deb unit-scripts trap),
  # and unseeded env files.
  smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: portal-steam-bot-deb
          path: out

      - name: Checksums verify
        run: cd out && sha256sum -c SHA256SUMS

      - name: Install
        run: sudo apt-get install -y ./out/portal-steam-bot_*.deb

      - name: Package sanity
        run: |
          set -x
          dpkg-query -W portal-steam-bot
          test -x /usr/bin/cs2-poller
          test -x /usr/bin/cs2-enricher
          getent passwd portal
          test -f /etc/portal/cs2-poller.env
          test -f /etc/portal/cs2-enricher.env
          # Enabled is what matters; the services can't run on CHANGE_ME env.
          systemctl is-enabled cs2-poller
          systemctl is-enabled cs2-enricher

      - name: Purge is clean
        run: |
          set -x
          sudo dpkg --purge portal-steam-bot
          ! test -e /etc/portal/cs2-poller.env
          ! test -e /etc/portal/cs2-enricher.env
          ! getent passwd portal

  # Attach to the GitHub release only after the smoke install passed.
  # softprops creates the release if the tag push is the first sighting.
  release:
    needs: smoke
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: portal-steam-bot-deb
          path: out

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.deb
            out/SHA256SUMS
          fail_on_unmatched_files: true
